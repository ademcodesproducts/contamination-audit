# Dataset registry. Each entry lists HuggingFace IDs in priority order
# (the loader falls back through the list on auth or rename failures) and the
# canonical local jsonl path under data/raw/.

math500:
  hf_ids:
    - HuggingFaceH4/MATH-500
    - TIGER-Lab/MATH-500
  split: test
  local: data/raw/math500.jsonl

s1:
  hf_ids:
    - simplescaling/s1K
    - simplescaling/s1k
  split: train
  local: data/raw/s1k.jsonl

tulu:
  # The shipped data/raw/tulu_math.jsonl (334,251 rows) is the FULL Tulu 3 SFT
  # mixture filtered to math sources by TULU_MATH_KEYWORDS in
  # scripts/00_load_datasets.py:32 -- five sources, of which
  # numinamath_tir_math_decontaminated is only 64,312 rows. The mixture must
  # therefore come first: listing numinamath first silently substitutes a
  # 5x smaller, differently-decontaminated corpus.
  # NOTE: TULU_MATH_KEYWORDS is itself an unspecified parameter. Restricting it
  # to {numina, interm_algebra} yields 84,312 rows -- the figure the old paper
  # draft reported. Which sources count as "math" is a free choice.
  hf_ids:
    - allenai/tulu-3-sft-mixture
    - ai2-adapt-dev/numinamath_tir_math_decontaminated
  split: train
  local: data/raw/tulu_math.jsonl

openthoughts:
  hf_ids:
    - open-thoughts/OpenThoughts-114k
  split: train
  local: data/raw/openthoughts.jsonl
  sample_size: 20000     # reproducible 20k sample with seed=42
  sample_seed: 42

openthoughts_full:
  hf_ids:
    - open-thoughts/OpenThoughts-114k
  split: train
  local: data/raw/openthoughts_full.jsonl
  sample_size: null      # use all 113,957 items (Table 2's headline row)
