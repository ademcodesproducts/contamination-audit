[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contamination-audit"
version = "0.1.0"
description = "Label-free measurement of decontamination filter error using temporal negative controls."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous Authors" }]
keywords = ["nlp", "benchmark-contamination", "decontamination", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.18.0",
    "transformers>=4.40.0",
    "tiktoken>=0.6.0",
    # The spaCy model the Tulu filter tokenises with is not on PyPI:
    #     python -m spacy download en_core_web_lg
    "spacy>=3.7.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
# scripts/06_llm_judge.py only. No result in the paper depends on it.
judge = ["openai>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
